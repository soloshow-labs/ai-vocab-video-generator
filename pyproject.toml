[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-vocab-video-generator"
version = "0.1.0"
description = "Generate narrated English vocabulary videos with AI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "SoloShow Labs" }]
maintainers = [{ name = "SoloShow Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "edge-tts>=6.1.12,<8",
  "filelock>=3.15,<4",
  "httpx>=0.27,<1",
  "moviepy>=1.0.3,<2",
  "pillow>=12.3,<13",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.2,<2",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]

[project.urls]
Homepage = "https://github.com/soloshow-labs/ai-vocab-video-generator"
Repository = "https://github.com/soloshow-labs/ai-vocab-video-generator.git"
Issues = "https://github.com/soloshow-labs/ai-vocab-video-generator/issues"
Documentation = "https://github.com/soloshow-labs/ai-vocab-video-generator#readme"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pip-audit>=2.10,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_vocab_video_generator"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.superpowers/**",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/.coverage",
  "/.worktrees/**",
  "/**/__pycache__",
  "/build",
  "/dist",
  "/htmlcov",
  "/storage",
  "/output",
  "/outputs",
  "/runtime",
  "/models",
  "/model_cache",
  "/logs",
  "/user_assets",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["ɑ", "ɪ", "ˈ", "ː", "×", "–", "，", "；", "："]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ai_vocab_video_generator"]
mypy_path = "src"

[tool.uv]
package = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
